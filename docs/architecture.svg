<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" font-family="sans-serif">
  <rect width="100%" height="100%" fill="white"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Cache hierarchy — request flow</text>
  <text x="380" y="48" text-anchor="middle" font-size="12" fill="#555">Dashed boxes are optional; the simulator supports all four combinations (see table below)</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- CPU -->
  <rect x="280" y="66" width="200" height="46" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="380" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#174ea6">CPU</text>
  <text x="380" y="102" text-anchor="middle" font-size="11" fill="#444">issues r / w + 32-bit address</text>

  <line x1="380" y1="112" x2="380" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>

  <!-- L1 -->
  <rect x="280" y="130" width="200" height="66" rx="6" fill="#e6f4ea" stroke="#188038" stroke-width="2"/>
  <text x="380" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#137333">L1 cache</text>
  <text x="380" y="170" text-anchor="middle" font-size="11" fill="#444">set-associative · LRU</text>
  <text x="380" y="186" text-anchor="middle" font-size="11" fill="#444">write-allocate · write-back</text>

  <!-- Victim cache (sidecar) -->
  <rect x="520" y="130" width="200" height="66" rx="6" fill="#fef7e0" stroke="#b06000" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="620" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a3e00">Victim cache (optional)</text>
  <text x="620" y="170" text-anchor="middle" font-size="11" fill="#444">fully associative (1 set)</text>
  <text x="620" y="186" text-anchor="middle" font-size="11" fill="#444">holds L1 evictions</text>
  <line x1="480" y1="152" x2="520" y2="152" stroke="#b06000" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="520" y1="180" x2="480" y2="180" stroke="#b06000" stroke-width="2" marker-end="url(#arr)"/>
  <text x="500" y="146" text-anchor="middle" font-size="11" fill="#7a3e00">swap</text>

  <!-- L1 -> L2 -->
  <line x1="380" y1="196" x2="380" y2="216" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="396" y="212" font-size="11" fill="#444">L1 miss</text>

  <!-- L2 -->
  <rect x="280" y="216" width="200" height="66" rx="6" fill="#f3e8fd" stroke="#7c4dff" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="380" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">L2 cache (optional)</text>
  <text x="380" y="256" text-anchor="middle" font-size="11" fill="#444">set-associative · LRU</text>
  <text x="380" y="272" text-anchor="middle" font-size="11" fill="#444">write-allocate · write-back</text>

  <!-- L2 -> memory -->
  <line x1="380" y1="282" x2="380" y2="302" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="396" y="298" font-size="11" fill="#444">L2 miss</text>

  <!-- Main memory -->
  <rect x="280" y="302" width="200" height="46" rx="6" fill="#fce8e6" stroke="#c5221f" stroke-width="2"/>
  <text x="380" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="#a50e0e">Main memory</text>
  <text x="380" y="338" text-anchor="middle" font-size="11" fill="#444">dirty evictions write back here</text>

  <!-- Address decomposition -->
  <text x="380" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">32-bit address decomposition</text>
  <rect x="110" y="396" width="330" height="34" fill="#1a73e8"/>
  <rect x="440" y="396" width="130" height="34" fill="#188038"/>
  <rect x="570" y="396" width="80" height="34" fill="#b06000"/>
  <text x="275" y="417" text-anchor="middle" font-size="12" font-weight="bold" fill="white">tag</text>
  <text x="505" y="417" text-anchor="middle" font-size="12" font-weight="bold" fill="white">index</text>
  <text x="610" y="417" text-anchor="middle" font-size="12" font-weight="bold" fill="white">offset</text>
  <text x="275" y="448" text-anchor="middle" font-size="11" fill="#444">32 − log2(sets) − log2(block size) bits</text>
  <text x="505" y="448" text-anchor="middle" font-size="11" fill="#444">log2(sets) bits</text>
  <text x="610" y="448" text-anchor="middle" font-size="11" fill="#444">log2(block) bits</text>

  <!-- Four configurations -->
  <text x="380" y="488" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Four supported configurations</text>
  <g font-size="12" fill="#222">
    <rect x="90" y="500" width="270" height="30" rx="6" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="225" y="519" text-anchor="middle">1 · L1 only</text>
    <rect x="400" y="500" width="270" height="30" rx="6" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="535" y="519" text-anchor="middle">2 · L1 + victim cache</text>
    <rect x="90" y="540" width="270" height="30" rx="6" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="225" y="559" text-anchor="middle">3 · L1 + L2</text>
    <rect x="400" y="540" width="270" height="30" rx="6" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="535" y="559" text-anchor="middle">4 · L1 + victim cache + L2</text>
  </g>
  <text x="380" y="600" text-anchor="middle" font-size="11" fill="#666">Chosen at run time by the VC_NUM_BLOCKS and L2_SIZE arguments (0 = absent).</text>
</svg>
